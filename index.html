<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UML.js</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <main id="canvas">
    <nav id="views" hidden></nav>
    <section id="start" class="start">
      <h2>Create a diagram</h2>
      <div class="tiles"></div>
      <p class="hint">or load a model with the toolbar, or drop a <code>.uml</code> file here</p>
      <p class="restore" hidden><a href="#" id="restore">Restore model</a></p>
    </section>
  </main>
  <div id="small-screen" class="small-screen" hidden>
    <p>UML.js is best used with a window size of at least 960 × 600 pixels. Touch support is limited.</p>
    <button type="button">OK</button>
  </div>
  <script type="module" src="/app/app.js"></script>
</body>
</html>
