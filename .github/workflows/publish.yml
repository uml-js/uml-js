name: Publish to npm

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

  # trusted publishing: npm accepts publishes from this workflow, without
  # token, and links the published package to the workflow run (provenance)
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # with the npm of Node, as later ones refuse git dependencies (bpmn-js-toolbar) by default
      - run: npm ci

      - run: npm test

      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest

      - run: npm publish --access public
